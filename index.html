<script>
  async function getLastUpdatedTime() {
    const owner = 'FEPSFY6901629';   // <= your GitHub owner from the screenshot
    const repo  = 'FY6901629';       // <= your repository name
    const url   = `https://api.github.com/repos/${owner}/${repo}/commits?sha=main&per_page=1`;
    const el    = document.getElementById('last-updated');

    try {
      const response = await fetch(url, {
        method: 'GET',
        headers: { 'Accept': 'application/vnd.github.v3+json' }
      });

      // Helpful diagnostics
      if (!response.ok) {
        const txt = await response.text().catch(()=>'');
        throw new Error(`GitHub API error ${response.status} ${response.statusText}: ${txt || '(no body)'}`);
      }

      const commits = await response.json();
      if (Array.isArray(commits) && commits.length && commits[0]?.commit?.committer?.date) {
        const dt = new Date(commits[0].commit.committer.date);
        el.textContent = `Last Modified Time: ${dt.toLocaleString()}`;
      } else {
        el.textContent = 'No commits found on branch "main".';
      }
    } catch (err) {
      console.error(err);
      // Common causes: wrong owner/repo, private repo, or rate limit
      el.textContent = 'Could not fetch last update (check owner/repo, privacy, or rate limit).';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    getLastUpdatedTime();
    const btn = document.getElementById('verify-btn');
    if (btn) btn.addEventListener('click', async () => {
      document.getElementById('last-updated').textContent = 'Verifying...';
      await getLastUpdatedTime();
      alert('Last modified time verified from GitHub API.');
    });
  });
</script>
